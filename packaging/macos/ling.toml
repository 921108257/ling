# 原生服务配置；升级保留已有文件。
# Native service defaults; upgrades preserve the existing file.
[server]
host = "127.0.0.1"
port = 6380

[engine]
shard_count = 4

[events]
mode = "fast"

# Fast 模式禁止指定 Journal 目录；切换 Reliable 时再配置此路径。
# Fast forbids a Journal directory; configure this path only when enabling Reliable.
# [event_journal]
# dir = "/usr/local/var/lib/ling/journal"
