# 共用静态二进制生成 DEB / RPM。/ Package the same static binaries as DEB / RPM.
name: ling
arch: ${NFPM_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
section: database
priority: optional
maintainer: 921108257 <921108257@users.noreply.github.com>
homepage: https://github.com/921108257/ling
description: |
  Standalone typed in-memory cache database and command-line client (preview).
  Reliable mode persists events and consumer metadata, not cached values or TTLs.
scripts:
  preinstall: packaging/linux/preinstall.sh
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
  postremove: packaging/linux/postremove.sh
contents:
  - src: ${NFPM_STAGE}/ling
    dst: /usr/bin/ling
    expand: true
    file_info:
      mode: 0755
  - src: ${NFPM_STAGE}/ling-cli
    dst: /usr/bin/ling-cli
    expand: true
    file_info:
      mode: 0755
  - src: packaging/linux/ling.service
    dst: /lib/systemd/system/ling.service
    file_info:
      mode: 0644
  - src: ${NFPM_STAGE}/ling.service.toml
    dst: /usr/share/ling/ling.service.toml
    expand: true
  - src: ${NFPM_STAGE}/ling.example.toml
    dst: /usr/share/ling/ling.example.toml
    expand: true
  - src: ${NFPM_STAGE}/README.md
    dst: /usr/share/ling/README.md
    expand: true
  - src: ${NFPM_STAGE}/docs/
    dst: /usr/share/ling/docs/
    expand: true
