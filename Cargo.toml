[workspace]
members = ["crates/types", "crates/protocol", "crates/server", "sdks/rust", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
linger-types = { path = "crates/types" }
linger-protocol = { path = "crates/protocol" }
linger-client = { path = "sdks/rust" }
linger-server = { path = "crates/server" }
tokio = { version = "1.48", features = ["io-util", "net", "rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
