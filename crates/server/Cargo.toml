[package]
name = "ling-server"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ling"
path = "src/main.rs"

[features]
default = ["self-update"]
# 官方发行版保留更新；源码部署可省去仅更新器使用的依赖。
# Official packages retain updates; source deployments can omit updater-only dependencies.
self-update = ["dep:reqwest", "dep:semver", "dep:tempfile", "dep:flate2", "dep:tar", "dep:zip"]

[dependencies]
ling-cli-help.workspace = true
ling-types.workspace = true
ling-protocol.workspace = true
ling-engine.workspace = true
ling-events.workspace = true
ling-network.workspace = true
tokio-rustls.workspace = true
rand.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
serde_json.workspace = true
fs2.workspace = true
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.11"
subtle = "2.6"
semver = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "9.6.1", optional = true, default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["time"] }

[dev-dependencies]
ling-client.workspace = true
# 测试专用故障点只经 dev-dependency 启用，不进入发行构建。
# Test-only failpoints are enabled through a dev-dependency and never reach release builds.
ling-engine = { workspace = true, features = ["failpoints"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
