[package]
name = "ling-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ling"
path = "src/main.rs"

[dependencies]
ling-cli-help.workspace = true
ling-types.workspace = true
ling-protocol.workspace = true
ling-engine.workspace = true
ling-events.workspace = true
ling-network.workspace = true
tokio-rustls.workspace = true
rand.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
serde_json.workspace = true
fs2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
subtle = "2.6"
semver = "1"
tempfile = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
ling-client.workspace = true
# 测试专用故障点只经 dev-dependency 启用，不进入发行构建。
# Test-only failpoints are enabled through a dev-dependency and never reach release builds.
ling-engine = { workspace = true, features = ["failpoints"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
