name: Subscription comparison

on:
  workflow_dispatch:
    inputs:
      baseline_revision:
        description: Exact baseline commit
        default: '89076a4a98b4cd72a732d48eebfc4938d09c7921'
      candidate_revision:
        description: Candidate ref (blank uses this workflow commit)
        default: ''

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.baseline_revision }}
          path: baseline
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          path: candidate
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action
        with:
          toolchain: 1.94.0
      - name: Validate measurement and pinned inputs
        working-directory: tooling
        run: |
          python3 scripts/ci-inputs.py check
          python3 -B -m unittest discover -s benchmarks -p 'test_v020.py' -v
      - name: Build both clean revisions before measurement
        run: |
          cargo build --manifest-path baseline/Cargo.toml --release --locked -p ling-server --bin ling
          cargo build --manifest-path candidate/Cargo.toml --release --locked -p ling-server --bin ling
      - name: Interleave three repetitions on the same runner
        env:
          OUTPUT: ${{ runner.temp }}/subscriptions
        run: |
          python3 - <<'PY'
          import json, os, pathlib, random, subprocess, sys
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['OUTPUT'])
          output.mkdir(exist_ok=False)
          jobs = [(variant, repeat) for variant in ('legacy', 'off', 'on') for repeat in range(1, 4)]
          random.Random(20261118).shuffle(jobs)
          (output / 'plan.json').write_text(json.dumps({
              'seed': 20261118, 'seconds_per_case': 5, 'jobs': jobs,
              'scope': 'same hosted Linux runner; not physical power loss or target deployment acceptance'
          }, indent=2) + '\n')
          results = []
          for variant, repeat in jobs:
              source = root / ('baseline' if variant == 'legacy' else 'candidate')
              command = [sys.executable, '-B', str(root / 'tooling/benchmarks/v020.py'),
                         str(output / f'{variant}-{repeat}'), '--source-root', str(source),
                         '--server-binary', str(source / 'target/release/ling'),
                         '--notification-mode', variant, '--event-mode', 'both',
                         '--repeats', '1', '--seconds', '5', '--seed', str(20261118 + repeat)]
              result = subprocess.run(command)
              results.append({'variant': variant, 'repeat': repeat, 'exit_code': result.returncode})
              (output / 'runs.json').write_text(json.dumps(results, indent=2) + '\n')
          if any(result['exit_code'] for result in results):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: subscriptions-${{ github.run_id }}
          path: ${{ runner.temp }}/subscriptions
          retention-days: 30
          if-no-files-found: warn
